<!-- Professional Cards Infographic - Premium Design -->
<div class="infographic-container" style="
  width: 100%;
  max-width: {{maxWidth}};
  aspect-ratio: {{aspectRatio}};
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  border-radius: 40px;
  box-shadow: 
    0 32px 64px -12px rgba(0, 0, 0, 0.3),
    0 0 0 1px rgba(255, 255, 255, 0.1),
    inset 0 0 0 1px rgba(255, 255, 255, 0.05);
  background:
    radial-gradient(ellipse at top left, {{colors.[0]}}40, transparent 50%),
    radial-gradient(ellipse at bottom right, {{colors.[0]}}30, transparent 50%),
    {{colors.[0]}};
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
">
  <!-- Animated Gradient Orbs Background -->
  <div style="
    position: absolute;
    top: -20%;
    right: -15%;
    width: 60%;
    height: 60%;
    background: radial-gradient(circle, {{colors.[0]}}20, transparent 70%);
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.5;
    pointer-events: none;
  "></div>

  <div style="
    position: absolute;
    bottom: -25%;
    left: -20%;
    width: 70%;
    height: 70%;
    background: radial-gradient(circle, {{colors.[1]}}18, transparent 70%);
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.5;
    pointer-events: none;
  "></div>

  <!-- Decorative Pattern Overlay -->
  <div style="
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image:
      repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.03) 35px, rgba(255,255,255,.03) 70px);
    pointer-events: none;
    opacity: 0.4;
  "></div>

  <!-- Main Content Wrapper with Dynamic Spacing -->
  <div style="
    position: relative;
    z-index: 1;
    height: 100%;
    padding: {{#if (eq viewMode 'portrait')}}0.9rem 0.8rem{{else if (eq cards.length 1)}}1.2rem 1rem{{else if (eq cards.length 2)}}1rem 0.9rem{{else if (eq cards.length 3)}}0.85rem 0.8rem{{else if (eq cards.length 4)}}0.75rem 0.7rem{{else if (eq cards.length 5)}}0.7rem 0.6rem{{else}}0.6rem 0.5rem{{/if}};
    display: flex;
    flex-direction: column;
    gap: {{#if (eq viewMode 'portrait')}}0.8rem{{else if (eq cards.length 1)}}1rem{{else if (eq cards.length 2)}}0.85rem{{else if (eq cards.length 3)}}0.75rem{{else if (eq cards.length 4)}}0.65rem{{else if (eq cards.length 5)}}0.55rem{{else}}0.45rem{{/if}};
  ">
    <!-- Header Section with Enhanced Styling -->
    <header style="
      text-align: center;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.88) 100%);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border-radius: 28px;
      padding: {{#if (eq viewMode 'portrait')}}1.1rem 0.9rem{{else if (eq cards.length 1)}}1.8rem 1.4rem{{else if (eq cards.length 2)}}1.5rem 1.3rem{{else if (eq cards.length 3)}}1.3rem 1.1rem{{else if (eq cards.length 4)}}1.1rem 1rem{{else}}1rem 0.9rem{{/if}};
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.12),
        0 4px 12px rgba(0, 0, 0, 0.06),
        inset 0 2px 8px rgba(255, 255, 255, 1),
        inset 0 -2px 4px rgba(0, 0, 0, 0.02);
      position: relative;
      overflow: hidden;
    ">
      <!-- Header Shine Effect -->
      <div style="
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.5) 50%, transparent 70%);
        pointer-events: none;
        opacity: 0.3;
      "></div>

      <!-- Subtle glow background -->
      <div style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 200%;
        height: 200%;
        background: 
          radial-gradient(circle at 30% 40%, {{colors.[0]}}10, transparent 40%),
          radial-gradient(circle at 70% 60%, {{colors.[2]}}10, transparent 40%);
        pointer-events: none;
      "></div>

      <h1 style="
        position: relative;
        z-index: 1;
        font-size: {{#if (eq viewMode 'portrait')}}1.2rem{{else if (eq cards.length 1)}}2rem{{else if (eq cards.length 2)}}1.8rem{{else if (eq cards.length 3)}}1.6rem{{else if (eq cards.length 4)}}1.4rem{{else}}1.3rem{{/if}};
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1.2;
        color: {{colors.[2]}};
        margin: 0 0 {{#if (eq viewMode 'portrait')}}0.3rem{{else if (eq cards.length 1)}}0.7rem{{else if (eq cards.length 2)}}0.6rem{{else if (eq cards.length 3)}}0.5rem{{else}}0.4rem{{/if}} 0;
        text-shadow: 0 2px 8px rgba(0,0,0,0.08);
        word-wrap: break-word;
        overflow-wrap: break-word;
        white-space: normal;
        max-width: 100%;
      ">{{title}}</h1>

      {{#if description}}
      <p style="
        position: relative;
        z-index: 1;
        font-size: {{#if (eq viewMode 'portrait')}}0.75rem{{else if (eq cards.length 1)}}1rem{{else if (eq cards.length 2)}}0.95rem{{else if (eq cards.length 3)}}0.9rem{{else if (eq cards.length 4)}}0.85rem{{else}}0.8rem{{/if}};
        color: {{colors.[2]}};
        margin: 0;
        font-weight: 600;
        line-height: 1.5;
        max-width: 90%;
        margin-left: auto;
        margin-right: auto;
        opacity: 0.92;
        white-space: normal;
      ">{{description}}</p>
      {{/if}}
    </header>

    <!-- Cards Grid with Dynamic Layout -->
    <div style="
      display: grid;
      grid-template-columns: {{#if (eq viewMode 'portrait')}}repeat(2, 1fr){{else if (eq viewMode 'landscape')}}repeat(4, 1fr){{else if (eq cards.length 1)}}1fr{{else if (eq cards.length 2)}}repeat(2, 1fr){{else if (eq cards.length 3)}}repeat(3, 1fr){{else if (eq cards.length 4)}}repeat(2, 1fr){{else if (eq cards.length 5)}}repeat(5, 1fr){{else}}repeat(3, 1fr){{/if}};
      gap: {{#if (eq viewMode 'portrait')}}0.65rem{{else if (eq cards.length 1)}}1.5rem{{else if (eq cards.length 2)}}1.2rem{{else if (eq cards.length 3)}}1rem{{else if (eq cards.length 4)}}0.9rem{{else if (eq cards.length 5)}}0.75rem{{else}}0.65rem{{/if}};
      flex: 1;
      align-content: center;
      align-items: stretch;
      width: 100%;
    ">      {{#each cards}}
      <article style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        background: {{../../colors.[1]}};
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        padding: {{#if (eq ../viewMode 'portrait')}}0.65rem 0.6rem{{else if (eq ../cards.length 1)}}2rem 1.8rem{{else if (eq ../cards.length 2)}}1.8rem 1.5rem{{else if (eq ../cards.length 3)}}1.5rem 1.3rem{{else if (eq ../cards.length 4)}}1.3rem 1.1rem{{else if (eq ../cards.length 5)}}1.1rem 1rem{{else}}0.9rem 0.85rem{{/if}};
        border-radius: 24px;
        border: 2px solid rgba(255, 255, 255, 0.9);
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.08),
          0 4px 12px rgba(0, 0, 0, 0.04),
          inset 0 2px 4px rgba(255, 255, 255, 1),
          inset 0 -1px 2px rgba(0, 0, 0, 0.02);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        transform: translateY(0);
        overflow: hidden;
        height: 100%;
      ">
        <!-- Shimmer effect on hover -->
        <div style="
          position: absolute;
          top: 0;
          left: -100%;
          width: 100%;
          height: 100%;
          background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
          transform: skewX(-20deg);
          transition: left 0.5s ease-in-out;
          pointer-events: none;
        "></div>
        <!-- Gradient Top Edge -->
        <div style="
          position: absolute;
          top: 0; left: 0; right: 0;
          height: 4px;
          background: linear-gradient(90deg, {{../../colors.[0]}}, {{../../colors.[1]}}, {{../../colors.[2]}});
          border-radius: 24px 24px 0 0;
          opacity: 0.8;
        "></div>

        {{#if this.icon}}
        <!-- Icon with Gradient Background & Glow -->
        <div style="
          position: relative;
          font-size: {{#if (eq ../cards.length 1)}}4rem{{else if (eq ../cards.length 2)}}3.5rem{{else if (eq ../cards.length 3)}}3rem{{else if (eq ../cards.length 4)}}2.5rem{{else if (eq ../cards.length 5)}}2.25rem{{else}}2rem{{/if}};
          margin-bottom: {{#if (eq ../cards.length 1)}}1.5rem{{else if (eq ../cards.length 2)}}1.3rem{{else if (eq ../cards.length 3)}}1.1rem{{else if (eq ../cards.length 4)}}1rem{{else}}0.9rem{{/if}};
          width: {{#if (eq ../cards.length 1)}}5.5rem{{else if (eq ../cards.length 2)}}5rem{{else if (eq ../cards.length 3)}}4.5rem{{else if (eq ../cards.length 4)}}3.5rem{{else if (eq ../cards.length 5)}}3.25rem{{else}}3rem{{/if}};
          height: {{#if (eq ../cards.length 1)}}5.5rem{{else if (eq ../cards.length 2)}}5rem{{else if (eq ../cards.length 3)}}4.5rem{{else if (eq ../cards.length 4)}}3.5rem{{else if (eq ../cards.length 5)}}3.25rem{{else}}3rem{{/if}};
          display: flex;
          align-items: center;
          justify-content: center;
          background: 
            linear-gradient(135deg, {{../../colors.[0]}}25, {{../../colors.[2]}}25),
            radial-gradient(circle at 30% 30%, {{../../colors.[0]}}15, transparent 50%);
          border-radius: 50%;
          box-shadow: 
            0 12px 28px rgba(0, 0, 0, 0.12),
            0 0 20px {{../../colors.[0]}}30,
            inset 0 2px 8px rgba(255,255,255,0.5);
        ">{{this.icon}}</div>
        {{/if}}

        <h3 style="
          position: relative;
          z-index: 1;
          font-size: {{#if (eq ../cards.length 1)}}1.8rem{{else if (eq ../cards.length 2)}}1.5rem{{else if (eq ../cards.length 3)}}1.3rem{{else if (eq ../cards.length 4)}}1.15rem{{else if (eq ../cards.length 5)}}1.05rem{{else}}0.95rem{{/if}};
          color: {{../../colors.[2]}};
          margin: 0 0 {{#if (eq ../cards.length 1)}}1.2rem{{else if (eq ../cards.length 2)}}1rem{{else if (eq ../cards.length 3)}}0.9rem{{else}}0.8rem{{/if}} 0;
          font-weight: 700;
          letter-spacing: -0.01em;
          line-height: 1.2;
        ">{{this.heading}}</h3>

        <p style="
          position: relative;
          z-index: 1;
          font-size: {{#if (eq ../cards.length 1)}}1.15rem{{else if (eq ../cards.length 2)}}1rem{{else if (eq ../cards.length 3)}}0.95rem{{else if (eq ../cards.length 4)}}0.88rem{{else if (eq ../cards.length 5)}}0.83rem{{else}}0.78rem{{/if}};
          color: {{../../colors.[3]}};
          margin: 0;
          line-height: 1.5;
          font-weight: 500;
          opacity: 0.88;
        ">{{this.description}}</p>
      </article>
      {{/each}}
    </div>
  </div>

  <!-- Decorative Corner Elements -->
  <div style="
    position: absolute;
    top: 0; left: 0;
    width: 120px; height: 120px;
    background: radial-gradient(circle at top left, {{colors.[0]}}40, transparent 70%);
    pointer-events: none;
  "></div>
  <div style="
    position: absolute;
    bottom: 0; right: 0;
    width: 120px; height: 120px;
    background: radial-gradient(circle at bottom right, {{colors.[2]}}40, transparent 70%);
    pointer-events: none;
  "></div>
</div>
