<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>composer stat-row</title>
  <style>
    :root {
      --color-bg: #f3f1ee; --color-surface: #f3f1ee; --color-card: #ffffff;
      --color-ink: #1c1916; --color-muted: #5c564e; --color-rule: #d9d0c6;
      --color-accent: #8a8175; --color-accent2: #8a8175; --color-on-accent: #f3f1ee;
      --font-display: "Calibri"; --font-text: "Calibri";
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1600px; height: 900px; overflow: hidden; background: var(--color-bg); }
    .slide { position: relative; width: 1600px; height: 900px; background: var(--color-bg); color: var(--color-ink); font-family: var(--font-text); }
    .field { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; background: var(--color-bg); }
    [data-stack="main"] {
      position: absolute; left: 72px; top: 72px; width: 1456px; height: 780px;
      display: flex; flex-direction: column; align-items: flex-start; gap: 36px;
    }
    [data-role="title"] {
      width: 100%;
      font-family: var(--font-display); font-size: 48px; font-weight: 700; line-height: 1.1; color: var(--color-ink); text-align: left;
    }
    .stat-grid {
      width: 100%;
      display: flex; flex-direction: row; gap: 48px;
    }
    .stat-cell {
      display: flex; flex-direction: column; gap: 12px; width: 400px;
    }
    [data-role^="stat-"] {
      width: 100%;
      font-family: var(--font-display); font-size: 72px; font-weight: 700; line-height: 1; color: var(--color-ink); text-align: left;
    }
    [data-role^="label-"] {
      width: 100%;
      font-family: var(--font-text); font-size: 20px; font-weight: 400; line-height: 1.3; color: var(--color-ink); text-align: left;
    }
    [data-role="body"] {
      width: 100%;
      font-family: var(--font-text); font-size: 22px; font-weight: 400; line-height: 1.35; color: var(--color-muted); text-align: left;
    }
    .slide[data-variant="two-up"] [data-role="stat-3"],
    .slide[data-variant="two-up"] [data-role="label-3"],
    .slide[data-variant="two-up"] .stat-cell-3 { display: none; }
  </style>
</head>
<body>
  <div class="slide" data-component="stat-row" data-variant="three-up">
    <div class="field" data-role="field"></div>
    <div data-stack="main" data-stack-align="start">
      <div data-role="title" data-max-chars="48">Proof in the numbers</div>
      <div class="stat-grid">
        <div class="stat-cell" data-stack="stat-1" data-stack-align="start">
          <div data-role="stat-1" data-max-chars="6">47%</div>
          <div data-role="label-1" data-max-chars="28">Churn after rebuild</div>
        </div>
        <div class="stat-cell" data-stack="stat-2" data-stack-align="start">
          <div data-role="stat-2" data-max-chars="6">12d</div>
          <div data-role="label-2" data-max-chars="28">Median close cycle</div>
        </div>
        <div class="stat-cell stat-cell-3" data-stack="stat-3" data-stack-align="start">
          <div data-role="stat-3" data-max-chars="6">98%</div>
          <div data-role="label-3" data-max-chars="28">On-time payroll runs</div>
        </div>
      </div>
      <div data-role="body" data-max-chars="120">Supporting detail for the figures stays under one hundred twenty characters total.</div>
    </div>
  </div>
</body>
</html>
