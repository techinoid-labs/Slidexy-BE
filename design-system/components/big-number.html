<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>composer big-number</title>
  <style>
    :root {
      --color-bg: #f3f1ee; --color-surface: #f3f1ee; --color-card: #ffffff;
      --color-ink: #1c1916; --color-muted: #5c564e; --color-rule: #d9d0c6;
      --color-accent: #8a8175; --color-accent2: #8a8175; --color-on-accent: #f3f1ee;
      --font-display: "Calibri"; --font-text: "Calibri";
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1600px; height: 900px; overflow: hidden; background: var(--color-bg); }
    .slide { position: relative; width: 1600px; height: 900px; background: var(--color-bg); color: var(--color-ink); font-family: var(--font-text); }
    .field { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; background: var(--color-bg); }
    [data-stack="number"] {
      position: absolute; left: 96px; top: 160px; width: 900px; height: 600px;
      display: flex; flex-direction: column; align-items: flex-start; gap: 20px;
    }
    [data-role="number"] {
      width: 100%; font-family: var(--font-display); font-size: 180px; font-weight: 700; line-height: 0.95; color: var(--color-ink);
    }
    [data-role="label"] {
      width: 100%; font-family: var(--font-display); font-size: 36px; font-weight: 600; line-height: 1.15; color: var(--color-ink);
    }
    [data-role="body"] {
      width: 100%; font-family: var(--font-text); font-size: 22px; font-weight: 400; line-height: 1.35; color: var(--color-muted);
    }
    [data-role="photo"] {
      position: absolute; object-fit: cover; object-position: center; background: var(--color-rule); display: none;
    }
    .slide[data-variant="left"] [data-stack="number"] { left: 96px; align-items: flex-start; }
    .slide[data-variant="centered"] [data-stack="number"] {
      left: 250px; width: 1100px; align-items: center;
    }
    .slide[data-variant="centered"] [data-role="number"],
    .slide[data-variant="centered"] [data-role="label"],
    .slide[data-variant="centered"] [data-role="body"] { text-align: center; }
    .slide[data-variant="with-photo"] [data-role="photo"] {
      display: block; left: 960px; top: 0; width: 640px; height: 900px; z-index: 1;
    }
    .slide[data-variant="with-photo"] [data-stack="number"] { width: 780px; z-index: 2; }
  </style>
</head>
<body>
  <div class="slide" data-component="big-number" data-variant="left">
    <div class="field" data-role="field"></div>
    <div data-stack="number" data-stack-align="start">
      <div data-role="number" data-max-chars="8">99.9%</div>
      <div data-role="label" data-max-chars="40">On-time payroll accuracy</div>
      <div data-role="body" data-max-chars="100">Measured across active clients over the last trailing twelve months.</div>
    </div>
    <img data-role="photo" alt="" width="640" height="900" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  </div>
</body>
</html>
