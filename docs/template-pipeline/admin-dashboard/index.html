<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Template Generator</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: #f4f1ea; color: #1c1916; }
    header { padding: 28px 32px 8px; }
    h1 { margin: 0; font-size: 32px; font-weight: 600; }
    p.note { margin: 8px 0 0; color: #5c564e; font-family: "Segoe UI", sans-serif; font-size: 14px; }
    form { display: grid; gap: 12px; padding: 20px 32px 8px; max-width: 980px; font-family: "Segoe UI", sans-serif; }
    label { font-size: 14px; }
    input, select { font: inherit; padding: 10px 12px; border: 1px solid #c8c0b4; background: #fff; border-radius: 8px; }
    .row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
    .row label { flex: 1; display: grid; gap: 6px; }
    #niche-wrap { flex: 0 0 200px; }
    label[hidden] { display: none !important; }
    .check { display: flex; gap: 8px; align-items: center; }
    #deck-name { margin: 8px 32px 0; font-size: 22px; font-weight: 600; }
    button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 0; cursor: pointer; }
    button:disabled { cursor: wait; opacity: 0.6; }
    #generate { background: #1c1916; color: #f4f1ea; }
    #status { min-height: 1.4em; padding: 8px 32px; font-family: "Segoe UI", sans-serif; }
    #preview { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 8px 32px 24px; }
    figure { margin: 0; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    figcaption { padding: 8px 10px; font-family: "Segoe UI", sans-serif; font-size: 13px; }
    img { display: block; width: 100%; height: auto; background: #ddd; }
    .actions { display: flex; gap: 12px; padding: 0 32px 40px; font-family: "Segoe UI", sans-serif; }
    #publish { background: #1e3a32; color: #f4f1ea; }
    #discard { background: #fff; color: #1c1916; border: 1px solid #1c1916; }
    #download { display: inline-block; padding: 10px 16px; border-radius: 8px; background: #163A5F; color: #F3F1EC; text-decoration: none; }
    #seeds { padding: 8px 32px 24px; font-family: "Segoe UI", sans-serif; }
    #seeds h2 { margin: 12px 0; font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 600; }
    table { width: 100%; max-width: 1200px; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e4ddd2; font-size: 14px; vertical-align: top; }
    td:nth-child(4) { max-width: 420px; }
    th { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #5c564e; }
    tr.disabled td { color: #8a8176; }
    .seed-disable { background: #fff; color: #1c1916; border: 1px solid #1c1916; padding: 6px 10px; }
    @media (max-width: 800px) { #preview { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Admin Template Generator</h1>
    <p class="note">Internal curator. Generated decks stay temporary until you publish them.</p>
  </header>
  <form id="form" novalidate>
    <div class="row">
      <label>What is this template about?
        <input id="prompt" name="prompt" type="text" maxlength="500" required placeholder="A luxury boutique hotel in Paris.">
      </label>
      <label id="mode-wrap">Mode
        <select id="mode" name="mode">
          <option value="composer" selected>Composer</option>
          <option value="auto">Auto-Select</option>
          <option value="pinned">Pinned</option>
          <option value="assemble">Assemble</option>
          <option value="native">Native</option>
          <option value="remix">Remix</option>
        </select>
      </label>
      <label id="nonce-wrap">Nonce
        <input id="nonce" name="nonce" type="text" maxlength="80" placeholder="optional run id">
      </label>
      <label id="niche-wrap">Niche
        <select id="niche" name="niche">
          <option value="">Auto-Detect</option>
          <option value="corporate">Corporate</option>
          <option value="elegant">Elegant</option>
          <option value="gradient">Gradient</option>
          <option value="infographic">Infographic</option>
          <option value="cartoon">Cartoon</option>
        </select>
      </label>
    </div>
    <p id="vibe" class="note" hidden></p>
    <div class="row">
      <label>Base layout
        <select id="layout" name="layoutId" required>
          <option value="" disabled selected>Reading app-library…</option>
        </select>
      </label>
      <label id="seed-b-wrap" hidden>Second seed
        <select id="layout-b" name="layoutIdB"></select>
      </label>
      <button id="generate" type="submit">Generate</button>
    </div>
    <label class="check">
      <input id="auto" name="autoLayout" type="checkbox">
      Auto-Select Best Layout
    </label>
    <label class="check">
      <input id="remix" name="remix" type="checkbox">
      Frankenstein Remix
    </label>
    <label class="check">
      <input id="assemble" name="assemble" type="checkbox">
      Auto-Assemble Deck (Max Variety)
    </label>
    <label class="check">
      <input id="native" name="native" type="checkbox">
      Native Engine (100% Original)
    </label>
    <label class="check">
      <input id="creative" name="creative" type="checkbox">
      Creative Mode
    </label>
  </form>
  <div id="status" role="status"></div>
  <h2 id="deck-name" hidden></h2>
  <p id="composer-meta" class="note" hidden></p>
  <div id="preview"></div>
  <div class="actions" hidden id="actions">
    <button id="publish" type="button">Publish to Catalog</button>
    <a id="download" hidden>Download PPTX</a>
    <button id="discard" type="button">Discard</button>
  </div>
    <section id="seeds">
      <h2>Seed library</h2>
      <form id="upload-form" class="row">
        <label>Upload a folder of seeds
          <input id="folder" name="folder" type="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation" webkitdirectory directory multiple>
        </label>
        <button id="add-folder" type="button">Add folder</button>
      </form>
      <p class="note">Every PowerPoint in the folder is converted, then scored. Scoring takes a few minutes per deck. A score of 70 or more can be used by Auto-Select.</p>
    <table>
      <thead>
        <tr><th>Layout</th><th>Score</th><th>Use</th><th>Failures</th><th></th></tr>
      </thead>
      <tbody id="seed-list"></tbody>
    </table>
  </section>
  <script>
    const form = document.getElementById("form");
    const folderButton = document.getElementById("add-folder");
    const status = document.getElementById("status");
    const vibeLine = document.getElementById("vibe");
    const preview = document.getElementById("preview");
    const actions = document.getElementById("actions");
    const generateButton = document.getElementById("generate");
    const publishButton = document.getElementById("publish");
    const discardButton = document.getElementById("discard");
    const autoBox = document.getElementById("auto");
    const remixBox = document.getElementById("remix");
    const assembleBox = document.getElementById("assemble");
    const nativeBox = document.getElementById("native");
    const creativeBox = document.getElementById("creative");
    const nicheSelect = document.getElementById("niche");
    const downloadLink = document.getElementById("download");
    const layoutSelect = document.getElementById("layout");
    const layoutBSelect = document.getElementById("layout-b");
    const seedBWrap = document.getElementById("seed-b-wrap");
    const deckName = document.getElementById("deck-name");
    const modeSelect = document.getElementById("mode");
    const nonceWrap = document.getElementById("nonce-wrap");
    const nonceInput = document.getElementById("nonce");
    const composerMeta = document.getElementById("composer-meta");
    let currentId = "";
    let syncingFromMode = false;

    function selectedMode() {
      return modeSelect.value || "composer";
    }

    function syncModes() {
      const mode = selectedMode();
      const composing = mode === "composer";
      const assembling = assembleBox.checked || mode === "assemble";
      const native = nativeBox.checked || mode === "native";
      const remixing = (remixBox.checked || mode === "remix") && !native && !composing;
      const autoing = autoBox.checked || mode === "auto";
      nonceWrap.hidden = !composing;
      seedBWrap.hidden = !remixing;
      layoutBSelect.disabled = !remixing;
      layoutBSelect.required = remixing;
      layoutSelect.disabled = composing || assembling || autoing || native;
      layoutSelect.required = mode === "pinned";
    }

    function applyModeToChecks() {
      syncingFromMode = true;
      const mode = selectedMode();
      autoBox.checked = mode === "auto";
      remixBox.checked = mode === "remix";
      assembleBox.checked = mode === "assemble";
      nativeBox.checked = mode === "native";
      if (mode !== "native") {
        creativeBox.checked = false;
        if (mode !== "composer") nicheSelect.value = "";
      }
      syncingFromMode = false;
      syncModes();
    }

    modeSelect.addEventListener("change", applyModeToChecks);

    autoBox.addEventListener("change", () => {
      if (syncingFromMode) return;
      if (autoBox.checked) {
        remixBox.checked = false;
        assembleBox.checked = false;
        nativeBox.checked = false;
        creativeBox.checked = false;
        nicheSelect.value = "";
        modeSelect.value = "auto";
      } else if (selectedMode() === "auto") {
        modeSelect.value = "pinned";
      }
      syncModes();
    });

    remixBox.addEventListener("change", () => {
      if (syncingFromMode) return;
      if (remixBox.checked) {
        autoBox.checked = false;
        assembleBox.checked = false;
        nativeBox.checked = false;
        creativeBox.checked = false;
        nicheSelect.value = "";
        modeSelect.value = "remix";
      } else if (selectedMode() === "remix") {
        modeSelect.value = "pinned";
      }
      syncModes();
    });

    assembleBox.addEventListener("change", () => {
      if (syncingFromMode) return;
      if (assembleBox.checked) {
        autoBox.checked = false;
        remixBox.checked = false;
        nativeBox.checked = false;
        creativeBox.checked = false;
        nicheSelect.value = "";
        modeSelect.value = "assemble";
      } else if (selectedMode() === "assemble") {
        modeSelect.value = "pinned";
      }
      syncModes();
    });

    nativeBox.addEventListener("change", () => {
      if (syncingFromMode) return;
      if (nativeBox.checked) {
        autoBox.checked = false;
        remixBox.checked = false;
        assembleBox.checked = false;
        modeSelect.value = "native";
      } else {
        creativeBox.checked = false;
        nicheSelect.value = "";
        if (selectedMode() === "native") modeSelect.value = "pinned";
      }
      syncModes();
    });

    creativeBox.addEventListener("change", () => {
      if (syncingFromMode) return;
      if (creativeBox.checked) {
        nativeBox.checked = true;
        autoBox.checked = false;
        remixBox.checked = false;
        assembleBox.checked = false;
        modeSelect.value = "native";
      }
      syncModes();
    });

    nicheSelect.addEventListener("change", () => {
      if (syncingFromMode) return;
      if (nicheSelect.value) {
        nativeBox.checked = true;
        autoBox.checked = false;
        remixBox.checked = false;
        assembleBox.checked = false;
        modeSelect.value = "native";
      }
      syncModes();
    });

    async function loadLayouts(message) {
      const select = document.getElementById("layout");
      const list = document.getElementById("seed-list");
      try {
        const response = await fetch("/api/admin/layouts");
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Could not read app-library");
        const layouts = data.layouts || [];
        const enabled = layouts.filter((item) => !item.disabled);
        select.replaceChildren();
        layoutBSelect.replaceChildren();
        if (!layouts.length) {
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "Upload a folder to add layouts";
          select.append(option);
          list.replaceChildren();
          status.textContent = message || "No seeds yet. Upload a folder of PowerPoint files.";
          return;
        }
        enabled.forEach((item) => {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = item.id;
          select.append(option);
          layoutBSelect.append(option.cloneNode(true));
        });
        if (!enabled.length) {
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "No enabled layouts";
          select.append(option);
        } else if (enabled.length > 1) layoutBSelect.value = enabled[1].id;
        list.replaceChildren();
        layouts.forEach((item) => {
          const row = document.createElement("tr");
          if (item.disabled) row.className = "disabled";
          const name = document.createElement("td");
          name.textContent = item.id;
          const score = document.createElement("td");
          score.textContent = item.qualityScore == null ? "Not scored" : String(item.qualityScore);
          const use = document.createElement("td");
          use.textContent = item.recommendedUse || "—";
          const failures = document.createElement("td");
          const reasons = Array.isArray(item.scoreFailures) ? item.scoreFailures : [];
          failures.textContent = reasons.length ? reasons.join("; ") : "—";
          const action = document.createElement("td");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "seed-disable";
          button.textContent = item.disabled ? "Enable Seed" : "Disable Seed";
          button.addEventListener("click", () => toggleSeed(item, button));
          action.append(button);
          row.append(name, score, use, failures, action);
          list.append(row);
        });
        status.textContent = message || (enabled.length + " enabled layouts. " + layouts.length + " seeds in the library.");
      } catch (error) {
        status.textContent = error.message;
      }
    }

    async function toggleSeed(item, button) {
      button.disabled = true;
      try {
        await post("/api/admin/disable-seed", { id: item.id, disabled: !item.disabled });
        await loadLayouts();
      } catch (error) {
        status.textContent = error.message;
        button.disabled = false;
      }
    }

    function setBusy(busy) {
      generateButton.disabled = busy;
      generateButton.textContent = busy ? "Working…" : "Generate";
      publishButton.disabled = busy;
      discardButton.disabled = busy;
    }

    async function post(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function pptxFiles(list) {
      return [...list].filter((file) => {
        const name = file.name || "";
        return name.toLowerCase().endsWith(".pptx") && !name.startsWith("~$");
      });
    }

    async function uploadSeed(file) {
      const response = await fetch("/api/admin/upload-seed?name=" + encodeURIComponent(file.name), {
        method: "POST",
        headers: { "Content-Type": "application/vnd.openxmlformats-officedocument.presentationml.presentation" },
        body: file,
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Upload failed");
      return data;
    }

    function setUploading(busy) {
      folderButton.disabled = busy;
    }

    loadLayouts();

    folderButton.addEventListener("click", async () => {
      const files = pptxFiles(document.getElementById("folder").files);
      if (!files.length) {
        status.textContent = "That folder has no PowerPoint files.";
        return;
      }
      setUploading(true);
      const failed = [];
      const scores = [];
      let added = 0;
      let lastId = "";
      try {
        for (let index = 0; index < files.length; index += 1) {
          const file = files[index];
          const place = (index + 1) + " of " + files.length;
          status.textContent = "Converting " + place + ": " + file.name;
          let data = null;
          try {
            data = await uploadSeed(file);
            added += 1;
            lastId = data.id;
          } catch (error) {
            failed.push(file.name + " (" + error.message + ")");
          }
          if (!data) continue;
          status.textContent = "Scoring " + place + ": " + data.id + ". This takes a few minutes.";
          try {
            scores.push(await post("/api/admin/score-seed", { id: data.id }));
          } catch (error) {
            failed.push(data.id + " score (" + error.message + ")");
          }
        }
        const ready = scores.filter((item) => Number(item.qualityScore) >= 70).length;
        const summary = "Added " + added + " of " + files.length + " seeds. "
          + scores.length + " scored. "
          + ready + " reached 70 and can be auto-selected."
          + (lastId ? " " + lastId + " is selected as the base layout." : "")
          + (failed.length ? " Failed: " + failed.join("; ") + "." : "");
        await loadLayouts(summary);
        if (lastId && [...layoutSelect.options].some((option) => option.value === lastId)) layoutSelect.value = lastId;
        document.getElementById("folder").value = "";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        setUploading(false);
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const promptValue = document.getElementById("prompt").value.trim();
      if (!promptValue) {
        status.textContent = "Type what the template is about, then press Generate.";
        return;
      }
      const mode = selectedMode();
      const composing = mode === "composer";
      if (!composing && !nativeBox.checked && !creativeBox.checked && !nicheSelect.value && !assembleBox.checked && !autoBox.checked && mode !== "auto" && mode !== "assemble" && mode !== "native" && !layoutSelect.value) {
        status.textContent = "Choose a base layout, or turn on Native Engine.";
        return;
      }
      currentId = "";
      preview.replaceChildren();
      deckName.hidden = true;
      deckName.textContent = "";
      composerMeta.hidden = true;
      composerMeta.textContent = "";
      actions.hidden = true;
      downloadLink.hidden = true;
      vibeLine.hidden = true;
      vibeLine.textContent = "";
      const nicheName = nicheSelect.value;
      status.textContent = composing
        ? "Composing the kit deck. This takes about a minute."
        : creativeBox.checked
          ? "Drawing a creative magazine deck. No seed is opened."
          : (nativeBox.checked || nicheName || mode === "native")
            ? "Drawing a " + (nicheName || "native") + " deck. No seed is opened."
            : "Generating the deck. This takes about a minute.";
      setBusy(true);
      try {
        const native = !composing && (nativeBox.checked || creativeBox.checked || Boolean(nicheSelect.value) || mode === "native");
        const assemble = !composing && !native && (assembleBox.checked || mode === "assemble");
        const remix = !composing && !native && !assemble && (remixBox.checked || mode === "remix");
        const autoLayout = !composing && !native && !assemble && !remix && (autoBox.checked || mode === "auto");
        const data = await post("/api/admin/generate-template", {
          prompt: document.getElementById("prompt").value,
          mode: composing ? "composer" : (autoLayout ? "auto" : assemble ? "assemble" : remix ? "remix" : native ? "native" : "pinned"),
          nonce: composing ? nonceInput.value.trim() : "",
          layoutId: composing || native || assemble || autoLayout ? "" : layoutSelect.value,
          layoutIdB: remix ? layoutBSelect.value : "",
          remix,
          autoLayout,
          assemble,
          native,
          creative: creativeBox.checked,
          niche: nicheSelect.value,
        });
        currentId = data.id;
        const title = data.name || (data.deck && data.deck.name) || "";
        if (title) {
          deckName.textContent = title;
          deckName.hidden = false;
        }
        (data.slides || []).forEach((slide) => {
          const figure = document.createElement("figure");
          const image = document.createElement("img");
          image.src = slide.url;
          image.alt = slide.name;
          const caption = document.createElement("figcaption");
          caption.textContent = slide.name;
          figure.append(image, caption);
          preview.append(figure);
        });
        const score = data.analysis ? " Vision score " + data.analysis.score + " (" + data.analysis.passed + "/" + data.analysis.total + " slides passed)." : "";
        const promptText = document.getElementById("prompt").value.trim();
        const vibeName = data.vibe || (data.assembly && data.assembly.designLanguage) || "";
        if (vibeName) {
          vibeLine.textContent = "Prompt: " + promptText + " | Vibe: " + vibeName;
          vibeLine.hidden = false;
        }
        downloadLink.href = "/api/admin/download/" + data.id;
        downloadLink.hidden = false;
        if (composing || data.layoutId === "composer") {
          try {
            const rep = await fetch("/api/admin/replacements/" + encodeURIComponent(data.id)).then(async (response) => {
              const payload = await response.json();
              if (!response.ok) throw new Error(payload.error || "Could not load replacements");
              return payload;
            });
            const plan = ((rep.brief && rep.brief.plan) || []).map((slide, index) =>
              (index + 1) + ". " + slide.role + " · " + slide.component + " / " + slide.variant
            ).join(" · ");
            const fitCount = Array.isArray(rep.fits) ? rep.fits.length : 0;
            const collapseCount = Array.isArray(rep.collapses) ? rep.collapses.length : 0;
            composerMeta.textContent = "Plan: " + (plan || "(none)") + " | fits " + fitCount + " | collapses " + collapseCount;
            composerMeta.hidden = false;
          } catch (metaError) {
            composerMeta.textContent = "Plan unavailable: " + metaError.message;
            composerMeta.hidden = false;
          }
        }
        const layoutName = composing ? "composer" : (native ? "Native Engine, no seed" : (data.layoutId || ""));
        status.textContent = (data.slides || []).length + " slides ready. Layout " + layoutName + ". Saved as " + (data.deck && data.deck.id ? data.deck.id : data.id) + ".json." + score;
        actions.hidden = false;
      } catch (error) {
        status.textContent = error.message;
      } finally {
        setBusy(false);
      }
    });

    publishButton.addEventListener("click", async () => {
      if (!currentId) return;
      setBusy(true);
      status.textContent = "Publishing to the catalog.";
      try {
        const data = await post("/api/admin/publish-template", { id: currentId });
        currentId = "";
        actions.hidden = true;
        status.textContent = "Published. Saved at " + data.deckPath + ".";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        setBusy(false);
      }
    });

    discardButton.addEventListener("click", async () => {
      if (!currentId) return;
      setBusy(true);
      status.textContent = "Discarding the render.";
      try {
        await post("/api/admin/discard-template", { id: currentId });
        currentId = "";
        preview.replaceChildren();
        deckName.hidden = true;
        deckName.textContent = "";
        actions.hidden = true;
        downloadLink.hidden = true;
        composerMeta.hidden = true;
        composerMeta.textContent = "";
        status.textContent = "Discarded. The temporary slides and photos were deleted.";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        setBusy(false);
      }
    });

    applyModeToChecks();
  </script>
</body>
</html>
